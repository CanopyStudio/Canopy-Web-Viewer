<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haptics test</title>
<!-- A check of whether this phone's browser gives a page any buzz at all: a real switch, flipped by a finger. -->
<style>
body { margin: 0; padding: 32px 24px; background: #161717; color: #EAECEB; font: 17px/1.45 system-ui, sans-serif; }
h1 { font-size: 20px; margin: 0 0 12px; }
p { color: #A5A8A7; margin: 0 0 22px; }
label { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-radius: 10px; background: #262927; font-size: 18px; }
input { transform: scale(1.5); margin-right: 10px; }
button { margin-top: 18px; width: 100%; padding: 16px; border: 0; border-radius: 10px; background: #2F3332; color: #EAECEB; font: inherit; }
#said { margin-top: 18px; color: #D2F6D1; min-height: 1.4em; }
</style></head><body>
<h1>Haptics test</h1>
<p>Flip the switch with your finger a few times. If your phone ticks, this browser lets pages buzz. If it doesn't, no page can, and the viewer's buzzing can go.</p>
<label>Flip me <input type="checkbox" switch></label>
<button id="hidden">Try the hidden way (as the viewer does)</button>
<div id="said"></div>
<script>
const said = document.getElementById("said");
said.textContent = "vibrate: " + ("vibrate" in navigator ? "yes" : "no") + " | switch: " + (document.createElement("input").switch !== undefined || CSS.supports("selector(input[switch])") ? "maybe" : "unknown");
document.getElementById("hidden").addEventListener("click", () =>
{
    const label = document.createElement("label"), input = document.createElement("input");
    label.ariaHidden = "true"; label.style.display = "none";
    input.type = "checkbox"; input.setAttribute("switch", "");
    label.appendChild(input); document.head.appendChild(label); label.click(); label.remove();
    said.textContent = "Tapped: did it tick?";
});
</script>
</body></html>
